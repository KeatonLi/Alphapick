<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <!-- 背景圆 -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="#1a1a1e" />

  <!-- K线1 (左) — 小阳线，筑底 -->
  <line x1="12" y1="12" x2="12" y2="34" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <rect x="8" y="24" width="8" height="8" rx="2" fill="#818cf8" opacity="0.7" />

  <!-- K线2 (中) — 小阴线，浅回调 -->
  <line x1="22" y1="16" x2="22" y2="32" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <rect x="18" y="23" width="8" height="7" rx="2" fill="#34d399" opacity="0.65" />

  <!-- K线3 (右) — 大阳线，突破 -->
  <line x1="33" y1="6" x2="33" y2="34" stroke="#f87171" stroke-width="2.2" stroke-linecap="round" />
  <rect x="28" y="12" width="10" height="20" rx="2.5" fill="url(#candleGrad)" />
  <!-- 高光 -->
  <rect x="29" y="13" width="3" height="18" rx="1.5" fill="rgba(255,255,255,0.2)" />

  <defs>
    <linearGradient id="candleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
</svg>
