<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#23232b"/>
      <stop offset="100%" stop-color="#121216"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="rise" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="36" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 毛玻璃深炭灰底 -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- α 阿尔法环（拱门形：左腿 + 圆顶 + 右腿） -->
  <g fill="none" stroke="url(#accent)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M372 742 L372 470 A150 150 0 0 1 672 470 L672 742"/>
  </g>

  <!-- 上升趋势线（A股红涨，穿越阿尔法环） -->
  <g fill="none" stroke="url(#rise)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <path d="M286 668 L470 558 L556 588 L742 428"/>
  </g>
  <!-- 趋势线顶端亮点 -->
  <circle cx="742" cy="428" r="42" fill="#f87171"/>
  <circle cx="742" cy="428" r="16" fill="#ffffff"/>

  <!-- 底部小字：ALPHAPICK -->
  <text x="512" y="880" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="14" fill="rgba(255,255,255,0.55)">ALPHAPICK</text>
</svg>
