<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简奢华 · QuantForge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #fff; color: #1d1d1f; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 60px; }
.container { width: 720px; }
h1 { font-size: 52px; font-weight: 700; letter-spacing: -0.04em; color: #1d1d1f; margin-bottom: 8px; }
.sub { color: #86868b; font-size: 18px; font-weight: 400; line-height: 1.5; margin-bottom: 60px; max-width: 480px; }
/* Apple style card - borderless */
.card { border-bottom: 1px solid #d2d2d7; padding: 28px 0; display: flex; justify-content: space-between; align-items: center; }
.card:last-child { border-bottom: none; }
.card .info { display: flex; flex-direction: column; gap: 4px; }
.card .name { font-size: 15px; font-weight: 500; color: #1d1d1f; letter-spacing: 0.01em; }
.card .meta { font-size: 12px; color: #86868b; }
.card .numbers { text-align: right; }
.card .price { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.card .change { font-size: 13px; font-weight: 500; margin-top: 2px; }
.up { color: #ff3b30; }
.down { color: #34c759; }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #86868b; text-transform: uppercase; margin-bottom: 4px; padding-top: 24px; }
.nav { display: flex; gap: 32px; margin-bottom: 60px; }
.nav a { font-size: 13px; font-weight: 500; color: #86868b; text-decoration: none; letter-spacing: 0.01em; transition: color 0.2s; position: relative; }
.nav a.active { color: #1d1d1f; }
.nav a.active::after { content: ''; position: absolute; bottom: -4px; left: 0; right: 0; height: 2px; background: #1d1d1f; border-radius: 1px; }
.nav a:hover { color: #1d1d1f; }
.kpi-row { display: flex; gap: 60px; margin-bottom: 48px; }
.kpi { }
.kpi .num { font-size: 36px; font-weight: 700; letter-spacing: -0.03em; color: #1d1d1f; line-height: 1; }
.kpi .lbl { font-size: 13px; color: #86868b; margin-top: 6px; font-weight: 400; }
hr { border: none; border-top: 1px solid #d2d2d7; margin: 0 0 24px 0; }
.tag { display: inline-block; font-size: 11px; color: #86868b; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="container">
  <div class="nav">
    <a href="#" class="active">概览</a>
    <a href="#">市场报告</a>
    <a href="#">智能推荐</a>
    <a href="#">收益跟踪</a>
    <a href="#">设置</a>
  </div>

  <h1>QuantForge</h1>
  <p class="sub">AI 驱动的 A 股量化分析平台</p>

  <div class="kpi-row">
    <div class="kpi">
      <div class="num">90</div>
      <div class="lbl">近 90 天报告</div>
    </div>
    <div class="kpi">
      <div class="num">156</div>
      <div class="lbl">累计推荐</div>
    </div>
    <div class="kpi">
      <div class="num">62%</div>
      <div class="lbl">胜率</div>
    </div>
  </div>

  <hr>

  <div class="section-title">指数行情</div>
  <div class="card">
    <div class="info">
      <span class="name">上证指数</span>
      <span class="meta">SHA</span>
    </div>
    <div class="numbers">
      <div class="price">3,286.42</div>
      <div class="change up">+0.87%</div>
    </div>
  </div>
  <div class="card">
    <div class="info">
      <span class="name">深证成指</span>
      <span class="meta">SZA</span>
    </div>
    <div class="numbers">
      <div class="price">10,892.18</div>
      <div class="change down">-0.32%</div>
    </div>
  </div>
  <div class="card">
    <div class="info">
      <span class="name">创业板指</span>
      <span class="meta">ChiNext</span>
    </div>
    <div class="numbers">
      <div class="price">2,198.75</div>
      <div class="change up">+1.24%</div>
    </div>
  </div>

  <div class="section-title">热门板块</div>
  <div class="card">
    <div class="info"><span class="name">半导体</span></div>
    <div class="numbers"><div class="change up">+3.21%</div></div>
  </div>
  <div class="card">
    <div class="info"><span class="name">新能源</span></div>
    <div class="numbers"><div class="change up">+2.15%</div></div>
  </div>
  <div class="card">
    <div class="info"><span class="name">AI 算力</span></div>
    <div class="numbers"><div class="change down">-1.08%</div></div>
  </div>

  <div style="margin-top:40px;text-align:center">
    <span class="tag">✦ 极致留白 · 无边框 · Apple 产品页语言</span>
  </div>
</div>
</body>
</html>
