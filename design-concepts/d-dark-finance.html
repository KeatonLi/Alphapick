<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深色金融 · QuantForge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #0d0e12; color: #e8e9ed; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
.container { width: 840px; }
h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; color: #fff; margin-bottom: 4px; }
.sub { color: #6b7280; font-size: 14px; margin-bottom: 40px; }
/* dark card */
.card { background: #15171c; border: 1px solid #1f2128; border-radius: 16px; padding: 24px; transition: all 0.2s; }
.card:hover { border-color: #2f3140; }
.card .label { font-size: 11px; font-weight: 500; letter-spacing: 0.05em; color: #6b7280; text-transform: uppercase; margin-bottom: 8px; }
.card .value { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: #fff; }
.card .change { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; margin-top: 4px; }
.up { color: #f43f5e; }
.down { color: #22c55e; }
.row { display: flex; gap: 16px; }
.row > * { flex: 1; }
.nav { display: flex; gap: 2px; background: #15171c; padding: 4px; border-radius: 12px; border: 1px solid #1f2128; margin-bottom: 40px; }
.nav a { flex: 1; text-align: center; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; color: #6b7280; text-decoration: none; transition: all 0.2s; }
.nav a.active { background: #2563eb; color: #fff; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #1f2128; color: #6b7280; }
.grid-bg { background-image: radial-gradient(rgba(37,99,235,0.04) 1px, transparent 1px); background-size: 24px 24px; }
.accent-line { height: 3px; width: 40px; background: #2563eb; border-radius: 2px; margin-bottom: 20px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 6px; background: #1f2128; font-size: 12px; color: #6b7280; }
.data-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #1f2128; }
.data-row:last-child { border-bottom: none; }
.data-row .sname { font-size: 14px; font-weight: 500; color: #e8e9ed; }
.data-row .schange { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; }
.tag { display: inline-block; font-size: 11px; color: #6b7280; }
</style>
</head>
<body>
<div class="container grid-bg">
  <div class="nav">
    <a href="#" class="active">概览</a>
    <a href="#">市场报告</a>
    <a href="#">智能推荐</a>
    <a href="#">收益跟踪</a>
    <a href="#">设置</a>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px">
    <div>
      <h1>QuantForge</h1>
      <p class="sub" style="margin-bottom:0">AI 驱动的 A 股量化分析平台</p>
    </div>
    <div class="pill">⚡ 系统运行中</div>
  </div>

  <div class="accent-line"></div>

  <div class="row">
    <div class="card">
      <div class="label">上证指数</div>
      <div class="value">3,286.42</div>
      <div class="change up">+0.87%</div>
    </div>
    <div class="card">
      <div class="label">深证成指</div>
      <div class="value">10,892.18</div>
      <div class="change down">-0.32%</div>
    </div>
    <div class="card">
      <div class="label">创业板指</div>
      <div class="value">2,198.75</div>
      <div class="change up">+1.24%</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="label" style="margin-bottom:0">热门板块</span>
      <span class="badge">今日排行</span>
    </div>
    <div class="data-row">
      <span class="sname">半导体</span>
      <span class="schange up">+3.21%</span>
    </div>
    <div class="data-row">
      <span class="sname">新能源</span>
      <span class="schange up">+2.15%</span>
    </div>
    <div class="data-row">
      <span class="sname">AI 算力</span>
      <span class="schange down">-1.08%</span>
    </div>
  </div>

  <div style="margin-top:24px;text-align:center">
    <span class="tag">✦ 深色 · 等宽数字 · 金融终端氛围 · 蓝色点缀</span>
  </div>
</div>
</body>
</html>
